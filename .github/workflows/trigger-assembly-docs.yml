name: Notify Assembly Content Hub

on:
  push:
    branches: [staging, main]
    paths:
      - assembly-docs/**
      - .github/assembly-sync.json
      - .github/workflows/trigger-assembly-docs.yml
  workflow_dispatch:
    inputs:
      branch:
        description: Matching hub release track
        type: choice
        options: [staging, main]
        default: staging

permissions:
  contents: read

concurrency:
  group: assembly-hub-notification-${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create token scoped to the hub
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RAD_VERSION_CONTROL_APP_ID }}
          private-key: ${{ secrets.RAD_VERSION_CONTROL_PRIVATE_KEY }}
          owner: researchanddesire
          repositories: rad-app
      - name: Wake hub reconciliation
        uses: actions/github-script@v7
        env:
          SYNC_BRANCH: ${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const branch = process.env.SYNC_BRANCH;
            if (!['staging', 'main'].includes(branch)) throw new Error('Invalid release track');
            await github.rest.repos.createDispatchEvent({
              owner: 'researchanddesire', repo: 'rad-app',
              event_type: 'assembly-content-changed',
              client_payload: { repository: `${context.repo.owner}/${context.repo.repo}`, branch }
            });
