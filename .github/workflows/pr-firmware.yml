name: PR firmware validation
on:
  pull_request:
    branches: [staging, main]
    # No `edited`: a title or body edit must not start a second rig run.
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
env:
  RELEASE_BUILD_SHA: ${{ github.sha }}
  # The firmware directory. Keep in sync with pr-target-policy.yml and the
  # publish_firmware.yml push paths.
  FIRMWARE_PATHS: '^(src|include|lib|data|config|test|ButtplugIO)/|^(platformio\.ini|firmware_build_metadata\.py|serial_identity_build\.py|scripts/[^/]*\.sh)$'
  FIRMWARE_IGNORE: ''
  # Validation tooling also runs the rig so its own changes are exercised.
  VALIDATION_PATHS: '^(scripts/hil/|\.github/workflows/(pr-firmware|hardware-run)\.yml$|\.github/scripts/hil_evidence\.py$)'
jobs:
  changes:
    name: Firmware changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      firmware: ${{ steps.detect.outputs.firmware }}
    steps:
      - name: Detect firmware or validation changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"
          firmware="$(grep -E "$FIRMWARE_PATHS" <<< "$files" || true)"
          if [[ -n "$FIRMWARE_IGNORE" && -n "$firmware" ]]; then
            firmware="$(grep -Ev "$FIRMWARE_IGNORE" <<< "$firmware" || true)"
          fi
          validation="$(grep -E "$VALIDATION_PATHS" <<< "$files" || true)"
          if [[ -n "$firmware$validation" ]]; then
            printf '%s\n' "$firmware" "$validation" | sed '/^$/d'
            echo "firmware=true" >> "$GITHUB_OUTPUT"
          else
            echo "No firmware changes: build and hardware validation are not required."
            echo "firmware=false" >> "$GITHUB_OUTPUT"
          fi
  development_screens:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    name: Development screen ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        environment: [development]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: python -m unittest discover -s scripts -p 'test_capture_screen.py'
      - run: python -m unittest discover -s scripts -p 'test_serial_identity.py'
      - name: Compile development display capture (never upload)
        env:
          PIO_ENV: ${{ matrix.environment }}
        run: pio run -e "$PIO_ENV" -t buildprog -j 2
      - name: Verify development console inclusion
        env:
          PIO_ENV: ${{ matrix.environment }}
        run: python scripts/check_screen_build.py --build-dir ".pio/build/$PIO_ENV" --expect enabled
  harness_tests:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/hil/requirements.txt
      - run: python -m unittest discover -s scripts/hil -p 'test_*.py'
  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    name: Firmware ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            track: staging
            variant: r8
          - environment: production
            track: production
            variant: r8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - name: Build firmware
        env:
          PIO_ENV: ${{ matrix.environment }}
        run: pio run -e "$PIO_ENV" -j 2
      - name: Verify development console inclusion
        env:
          PIO_ENV: ${{ matrix.environment }}
        run: python scripts/check_screen_build.py --build-dir ".pio/build/$PIO_ENV" --expect disabled
      - name: Build the filesystem paired with this firmware
        env:
          PIO_ENV: ${{ matrix.environment }}
        run: pio run -e "$PIO_ENV" -t buildfs
      - name: Package the exact staging images
        if: matrix.track == 'staging'
        env:
          PIO_ENV: ${{ matrix.environment }}
          VARIANT: ${{ matrix.variant }}
        run: >-
          python scripts/hil/bundle.py --repository "$GITHUB_REPOSITORY"
          --build-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --variant "$VARIANT" --build-dir ".pio/build/$PIO_ENV" --output hardware-parts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.track == 'staging'
        with:
          name: hardware-parts-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.variant }}
          path: hardware-parts/
          if-no-files-found: error
          retention-days: 14
  prepare_hardware:
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: hardware-parts-${{ github.sha }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: hardware-bundle
      - name: Verify every staging variant belongs to this run
        run: >-
          python scripts/hil/bundle.py --merge --repository "$GITHUB_REPOSITORY"
          --build-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output hardware-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hardware-firmware-${{ github.sha }}-${{ github.run_attempt }}
          path: hardware-bundle/
          if-no-files-found: error
          retention-days: 14
  build_required:
    name: Build validation
    if: always()
    needs: [changes, harness_tests, firmware, prepare_hardware, development_screens]
    runs-on: ubuntu-latest
    steps:
      - name: Require every build and manifest validation for firmware changes
        env:
          FIRMWARE: ${{ needs.changes.outputs.firmware }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if results['changes']['result'] != 'success':
              raise SystemExit('Could not determine whether firmware changed')
          if os.environ['FIRMWARE'] != 'true':
              print('No firmware changes; build validation is not required.')
              raise SystemExit(0)
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required jobs did not pass: ' + ', '.join(failed))
          PY
  hardware:
    needs: [changes, build_required]
    if: >-
      needs.changes.outputs.firmware == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Use the exact reviewed wrapper commit allowed by the runner group.
    # Runner-group access is restricted to this full workflow path and ref.
    uses: researchanddesire/Open-Source-Wireless-Remote_RADR/.github/workflows/hardware-run.yml@ec0a99d8fc9a8b7e1c9a8c84d48ec619174ad0b3
  hardware_required:
    name: Hardware validation
    if: always()
    needs: [changes, build_required, hardware]
    runs-on: ubuntu-latest
    steps:
      - name: Reject skipped, missing, cancelled, or failed hardware validation of firmware changes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FIRMWARE: ${{ needs.changes.outputs.firmware }}
          BUILD_RESULT: ${{ needs.build_required.result }}
          HARDWARE_RESULT: ${{ needs.hardware.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$FIRMWARE" != true ]; then
            echo "No firmware changes; hardware validation is not required."
            exit 0
          fi
          test "$BUILD_RESULT" = success
          test "$HARDWARE_RESULT" = success
  hardware_evidence:
    name: Hardware evidence
    needs: [changes, hardware]
    # Posts on pass and fail. Fork PRs never reach the rig, so they have no evidence.
    if: >-
      !cancelled() && needs.changes.outputs.firmware == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.hardware.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: hardware-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: hardware-evidence
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Comment with the rig video and result
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: acjajruwevyyatztbkdf
          HARDWARE_RESULT: ${{ needs.hardware.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/hil_evidence.py --evidence hardware-evidence --pr "$PR_NUMBER" --hardware-result "$HARDWARE_RESULT"
