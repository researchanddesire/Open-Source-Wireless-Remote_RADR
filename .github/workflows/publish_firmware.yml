name: Publish immutable firmware candidate

on:
  # Manual runs republish the current branch head after a failed candidate.
  workflow_dispatch:
  push:
    # Versions are allocated and candidates published only for merges into main.
    branches: [main]
    paths:
      # The firmware directory only: a change here allocates the next version and
      # publishes a signed candidate. Keep in sync with FIRMWARE_PATHS in
      # pr-firmware.yml and pr-target-policy.yml. Release tooling changes are
      # exercised by PR checks and republished manually.
      - "software/firmware/**"
      - "software/scripts/*.sh"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: firmware-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  detect_auto_version:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect current-track auto-version commit
        id: detect
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if python software/scripts/release_version.py is-auto-commit --message "$COMMIT_MESSAGE" --track "$GITHUB_REF_NAME"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: detect_auto_version
    if: ${{ needs.detect_auto_version.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'firmware-production' || 'firmware-staging' }}
    defaults:
      run:
        working-directory: software/firmware
    env:
      FIRMWARE_PUBLISH_TOKEN: ${{ secrets.FIRMWARE_PUBLISH_TOKEN }}
      FIRMWARE_PROVENANCE_SIGNING_KEY_PEM: ${{ secrets.FIRMWARE_PROVENANCE_SIGNING_KEY_PEM }}
    steps:
      - name: Generate version-control token
        id: version_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RAD_VERSION_CONTROL_APP_ID }}
          private-key: ${{ secrets.RAD_VERSION_CONTROL_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ steps.version_token.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve merged PR title
        id: pull_request
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.version_token.outputs.token }}
          script: |
            const { data: pulls } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
            const title = pulls.find(
              (pull) =>
                pull.merged_at !== null &&
                pull.base.ref === process.env.GITHUB_REF_NAME,
            )?.title ?? "";
            core.setOutput("title", title);

      - name: Allocate and commit next version
        id: version
        working-directory: .
        env:
          PR_TITLE: ${{ steps.pull_request.outputs.title }}
          DEVICE_TYPE: radr
          VERSION_HEADER: software/firmware/src/constants/Version.h
          RELEASE_VERSION: software/scripts/release_version.py
        run: bash .github/scripts/allocate_version.sh
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Test publisher
        run: |
          python ../../.github/scripts/test_build_web_installer.py
          python ../../.github/scripts/test_firmware_provenance.py
          python ../../.github/scripts/test_publish_immutable_firmware.py
          python ../../.github/scripts/test_release_workflow.py

      - name: Run release helper tests
        run: python ../scripts/test_release_version.py

      - name: Run native unit tests
        run: pio test -e test_native

      - name: Select track build
        run: python ../../.github/scripts/release_workflow.py configure --branch "$GITHUB_REF_NAME"

      - name: Build application and filesystem
        run: |
          pio run -e "$PIO_ENV"
          pio run -e "$PIO_ENV" --target buildfs

      - name: Install pinned esptool runtime
        run: python -m pip install "$HOME/.platformio/packages/tool-esptoolpy"

      - name: Build merged web installer
        run: |
          python ../../.github/scripts/build_web_installer.py \
            --profile esp32s3-16mb \
            --build-dir ".pio/build/$PIO_ENV" \
            --filesystem ".pio/build/$PIO_ENV/littlefs.bin" \
            --partition-table config/partition.csv \
            --filesystem-partition spiffs \
            --output ".pio/build/$PIO_ENV/web-installer.bin"

      - name: Publish validating release
        id: publish
        run: |
          python ../../.github/scripts/publish_immutable_firmware.py \
            --device-type radr \
            --track "$TRACK" \
            --build-sha "$RELEASE_BUILD_SHA" \
            --version-file src/constants/Version.h \
            --artifact "filesystem:.pio/build/$PIO_ENV/littlefs.bin:1:true" \
            --artifact "application:.pio/build/$PIO_ENV/firmware.bin:2:true" \
            --artifact "bootloader:.pio/build/$PIO_ENV/bootloader.bin:3:false" \
            --artifact "partitions:.pio/build/$PIO_ENV/partitions.bin:4:false" \
            --artifact "web-installer:.pio/build/$PIO_ENV/web-installer.bin:5:false"

      - name: Candidate summary
        run: |
          echo "Release ${{ steps.publish.outputs.release_id }} is waiting for hardware validation" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Build: ${{ steps.version.outputs.release_build_sha }}" >> "$GITHUB_STEP_SUMMARY"
