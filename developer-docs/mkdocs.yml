      - Bill of Materials: hardware/bom.md
      - Printed Parts:
          - Overview: hardware/printed-parts/index.md
          - Part-by-Part:
              - Overview: hardware/printed-parts/part-by-part/index.md
              - Remote Top: hardware/printed-parts/part-by-part/remote-top.md
              - Remote Bottom: hardware/printed-parts/part-by-part/remote-bottom.md
              - Remote Knob: hardware/printed-parts/part-by-part/remote-knob.md
              - Buttons: hardware/printed-parts/part-by-part/buttons.md
              - Power Switch: hardware/printed-parts/part-by-part/power-switch.md
              - OSSM Remote Clip: hardware/printed-parts/part-by-part/ossm-remote-clip.md
      - Specifications:
          - Overview: hardware/specifications/index.md
          - Battery and Power: hardware/specifications/battery-and-power.md
          - Feedback and Indicators: hardware/specifications/feedback-and-indicators.md
  - Tools:
      - Web Flasher: tools/web-flasher.md
  - License: license.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
