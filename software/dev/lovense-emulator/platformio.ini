; Lovense BLE toy emulator for a Lockbox ESP32-S3 board.
;
; It uses the Lockbox's own platform, partition table and sdkconfig so that it
; can replace only the Lockbox application slot (app0 at 0x10000) for a short
; test and be swapped back afterwards. Never flash the bootloader, partition
; table, otadata, NVS or eFuses from this project.

[platformio]
default_envs = lockbox-r2

[common]
platform = espressif32@6.12.0
framework = arduino, espidf
board_build.partitions = partition.csv
lib_deps =
    h2zero/NimBLE-Arduino@2.4.0
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=2
monitor_speed = 115200

[env:lockbox-r8]
extends = common
board = esp32-s3-devkitc-1-n16r8v
board_build.arduino.memory_type = qio_opi
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.lockbox-r8

[env:lockbox-r2]
extends = common
board = esp32-s3-devkitc-1-n16r2v
board_build.arduino.memory_type = qio_qspi
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.psram-r2.defaults"
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.lockbox-r2
